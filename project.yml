name: WheelConvert
options:
  bundleIdPrefix: app.wheelconvert
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/build/deps/include
    # The compiler lists every localizable string; scripts/sync-strings.sh merges them into Resources/*.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Sparkle: updates are checked only when the public EdDSA key is set (README → Releasing).
    SPARKLE_PUBLIC_KEY: ""
    SPARKLE_FEED_URL: https://github.com/Agent15-AI/WheelConvert/releases/latest/download/appcast.xml
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  WheelConvert:
    type: application
    platform: macOS
    sources:
      - path: WheelConvert
        excludes:
          - "graphify-out/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wheelconvert.WheelConvert
        PRODUCT_NAME: WheelConvert
        INFOPLIST_FILE: WheelConvert/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: WheelConvert/Support/WheelConvert.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: WheelConvert/Support/WheelConvert-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/build/deps/lib
        OTHER_LDFLAGS: -lwebpmux -lwebp -lsharpyuv -lz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: Embed vendor tools
        script: '"$PROJECT_DIR/scripts/embed-vendor.sh"'
        basedOnDependencyAnalysis: false
  WheelConvertTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WheelConvertTests
    dependencies:
      - target: WheelConvert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wheelconvert.WheelConvertTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WheelConvert.app/Contents/MacOS/WheelConvert
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WheelConvert:
    build:
      targets:
        WheelConvert: all
        WheelConvertTests: [test]
    test:
      targets:
        - WheelConvertTests
