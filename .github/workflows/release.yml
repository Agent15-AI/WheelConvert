# Push a tag like v1.0.0 to build WheelConvert, publish a GitHub release with the .dmg, and
# point the Homebrew cask on main at it.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    # macOS 15 machines stopped picking up jobs (GitHub moved capacity to macOS 26, its macos-latest).
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          brew install xcodegen pkg-config openjdk@21
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)"
      # FFmpeg and its codecs take the longest to build; reuse them until their script changes.
      - name: Restore FFmpeg build
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/src
            Vendor/build/deps
            Vendor/build/bin
            Vendor/build/licenses
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: zsh scripts/build-ffmpeg.sh
      # Saved right away, so a failure in a later step doesn't throw the build away.
      - name: Save FFmpeg build
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/src
            Vendor/build/deps
            Vendor/build/bin
            Vendor/build/licenses
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Vendor builds
        run: |
          zsh scripts/build-java.sh
          zsh scripts/build-exiftool.sh
          (cd js && npm ci && npm run build)
      - name: Build release
        env:
          # Signs the update for Sparkle; see README → Releasing.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: zsh scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "WheelConvert ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
      - name: Update the Homebrew cask on main
        run: |
          cp Casks/wheelconvert.rb "$RUNNER_TEMP/wheelconvert.rb"
          git fetch origin main && git checkout main
          cp "$RUNNER_TEMP/wheelconvert.rb" Casks/wheelconvert.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew cask for $GITHUB_REF_NAME" && git push origin main
